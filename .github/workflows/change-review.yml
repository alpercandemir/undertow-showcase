name: Undertow business change review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: undertow-change-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: alpercandemir/undertow/actions/change-review@d9b6220bf2238887f7d438dbc8fee1d7b17412b5
        continue-on-error: true
        with:
          comment: 'true'
