name: Undertow business change review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: undertow-change-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: alpercandemir/undertow/actions/change-review@cbf43c4b7174c306c9f24bf4f3ebcb5d400a48a6 # v0.3.0
        continue-on-error: true
        with:
          comment: 'true'
