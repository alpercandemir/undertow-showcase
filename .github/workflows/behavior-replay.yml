name: Replay the Click stdin regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLICK_BASE: cfa6f4ad3e0078db43f866246b483544afa33ed3
      CLICK_HEAD: 262bdf02288daf9a37b9e815b44acafd62b5c6fe
    steps:
      - name: Check out the Click comparison
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pallets/click
          ref: ${{ env.CLICK_HEAD }}
          path: click
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the replay tools and reviewed probe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: alpercandemir/undertow
          ref: 74af9539a4bff90721a1dbf7f79434a05560b921
          path: undertow
          persist-credentials: false
      - name: Replay the scenario and export a pytest test
        shell: bash
        run: |
          output="$RUNNER_TEMP/click-replay"
          probe=undertow/evaluation/probes/click_stdin.py
          python3 -IB undertow/actions/behavior-replay/discover.py \
            --repo click --base "$CLICK_BASE" --head "$CLICK_HEAD" \
            --probe "$probe" --probe-module click.testing --output "$output"
          cat "$output/summary.md" >> "$GITHUB_STEP_SUMMARY"
          python3 -IB undertow/actions/behavior-replay/write_test.py \
            --report "$output/report.json" --probe "$probe" --expect base \
            --output "$output/test_stdin_regression.py"
      - name: Retain the evidence and test
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: click-stdin-regression
          path: ${{ runner.temp }}/click-replay
          if-no-files-found: error
          retention-days: 14
