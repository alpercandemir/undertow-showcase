name: Coupon behavior replay

on:
  pull_request:
    branches: [codex/coupon-rounding-baseline]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: coupon-replay-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  replay:
    name: Discover coupon behavior differences
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      attempt: ${{ steps.comparison.outputs.attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Find the comparison base
        id: comparison
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")" >> "$GITHUB_OUTPUT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - uses: alpercandemir/undertow/actions/behavior-replay@d9b6220bf2238887f7d438dbc8fee1d7b17412b5
        with:
          base: ${{ steps.comparison.outputs.base }}
          head: ${{ github.event.pull_request.head.sha }}
          artifact-name: coupon-behavior

  publish:
    name: Publish new behavior evidence
    needs: replay
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: alpercandemir/undertow/actions/replay-comment@d9b6220bf2238887f7d438dbc8fee1d7b17412b5
        with:
          artifact-pattern: coupon-behavior-replay-*-${{ needs.replay.outputs.attempt }}
