name: Coupon checkout replay

on:
  pull_request:
    branches: [codex/coupon-rounding-baseline]

permissions:
  contents: read

concurrency:
  group: coupon-replay-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replay coupon checkout tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Find the comparison base
        id: comparison
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")" >> "$GITHUB_OUTPUT"

      - name: Install pytest
        run: |
          python3 -m venv "$RUNNER_TEMP/replay-env"
          "$RUNNER_TEMP/replay-env/bin/python" -m pip install pytest==8.3.5
          echo "$RUNNER_TEMP/replay-env/bin" >> "$GITHUB_PATH"

      - name: Compare the three-item basket
        uses: alpercandemir/undertow/actions/test-replay@8875d27f44dc736061b5097b297e948774d4d8bd
        with:
          base: ${{ steps.comparison.outputs.base }}
          head: ${{ github.event.pull_request.head.sha }}
          test: tests/test_coupon_checkout.py::test_coupon_rounds_once_on_cart_subtotal
          artifact-name: coupon-1-three-item

      - name: Compare the single-item basket
        uses: alpercandemir/undertow/actions/test-replay@8875d27f44dc736061b5097b297e948774d4d8bd
        with:
          base: ${{ steps.comparison.outputs.base }}
          head: ${{ github.event.pull_request.head.sha }}
          test: tests/test_coupon_checkout.py::test_single_item_coupon_total
          artifact-name: coupon-2-single-item

  publish:
    name: Publish replay observations
    needs: replay
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: alpercandemir/undertow/actions/replay-comment@8875d27f44dc736061b5097b297e948774d4d8bd
        with:
          artifact-pattern: coupon-*-replay-*-${{ github.run_attempt }}
